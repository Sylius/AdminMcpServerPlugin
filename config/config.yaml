parameters:
    env(SYLIUS_ADMIN_MCP_SERVER_API_URL): 'https://127.0.0.1:8090/api/v2/admin/'
    env(SYLIUS_ADMIN_MCP_SERVER_API_EMAIL): 'api@example.com'
    env(SYLIUS_ADMIN_MCP_SERVER_API_PASSWORD): 'sylius-api'
    env(SYLIUS_ADMIN_MCP_SERVER_VERIFY_SSL): 'true'
    sylius_admin_mcp_server.api.base_uri: '%env(SYLIUS_ADMIN_MCP_SERVER_API_URL)%'
    sylius_admin_mcp_server.api.email: '%env(SYLIUS_ADMIN_MCP_SERVER_API_EMAIL)%'
    sylius_admin_mcp_server.api.password: '%env(SYLIUS_ADMIN_MCP_SERVER_API_PASSWORD)%'

framework:
    http_client:
        scoped_clients:
            sylius_admin_mcp_server.http_client.api:
                base_uri: '%sylius_admin_mcp_server.api.base_uri%'
                verify_peer: '%env(bool:SYLIUS_ADMIN_MCP_SERVER_VERIFY_SSL)%'
                verify_host: '%env(bool:SYLIUS_ADMIN_MCP_SERVER_VERIFY_SSL)%'
                headers:
                    Accept: 'application/ld+json'
                    Content-Type: 'application/ld+json'
            sylius_admin_mcp_server.http_client.api_merge_patch:
                base_uri: '%sylius_admin_mcp_server.api.base_uri%'
                verify_peer: '%env(bool:SYLIUS_ADMIN_MCP_SERVER_VERIFY_SSL)%'
                verify_host: '%env(bool:SYLIUS_ADMIN_MCP_SERVER_VERIFY_SSL)%'
                headers:
                    Accept: 'application/ld+json'
                    Content-Type: 'application/merge-patch+json'

mcp:
    app: 'Sylius Admin MCP Server'
    version: '0.1.0'
    pagination_limit: 200
    client_transports:
        stdio: true
        http: true
    discovery:
        scan_dirs: []
    instructions: |
        You are managing a Sylius e-commerce store via its Admin API (JSON-LD / Hydra).

        ## IRI identifiers
        Every resource in the API has an `@id` field which is its JSON-LD IRI (e.g. `/api/v2/admin/channels/WEB`).
        All tool parameters that reference another resource (channels, taxons, zones, etc.) accept EITHER:
        - a bare code/identifier: `"WEB"`
        - or the full IRI from a previous API response: `"/api/v2/admin/channels/WEB"`
        Both forms are equivalent — prefer using the IRI you already have from a previous response.

        ## Resource identifiers
        - Most resources are identified by `code` (string): products, taxons, channels, zones, promotions, etc.
        - Customers and addresses are identified by `id` (integer).
        - Orders are identified by `tokenValue` (string).
        - Product associations are identified by `id` (integer, exposed in list_product_associations).

        ## Monetary amounts
        All amounts (prices, order totals) are in the smallest currency unit: 1000 = 10.00 EUR/USD.

        ## Key workflows
        - Before creating/updating a product: run list_channels to know available channel codes/IRIs.
        - Every product needs at least one variant with a price to be purchasable in a channel.
        - Slug fields are auto-generated from the name — omit unless the user wants a custom URL.
        - Catalog promotions are processed asynchronously — never delete one immediately after creating it.
        - To disable a customer login use delete_customer_user, not delete_customer (customers cannot be deleted).

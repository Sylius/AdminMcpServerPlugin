sylius_admin_mcp_server_oauth_well_known_server:
    path: /.well-known/oauth-authorization-server
    controller: Sylius\AdminMcpServerPlugin\Controller\OAuth\WellKnownController::authorizationServer
    methods: [GET]

sylius_admin_mcp_server_oauth_well_known_resource:
    path: /.well-known/oauth-protected-resource
    controller: Sylius\AdminMcpServerPlugin\Controller\OAuth\WellKnownController::protectedResource
    methods: [GET]

sylius_admin_mcp_server_oauth_register:
    path: /_mcp/oauth/register
    controller: Sylius\AdminMcpServerPlugin\Controller\OAuth\RegistrationController
    methods: [POST]

sylius_admin_mcp_server_oauth_authorize:
    path: /admin/mcp/oauth/authorize
    controller: Sylius\AdminMcpServerPlugin\Controller\OAuth\AuthorizationController::authorize
    methods: [GET, POST]

sylius_admin_mcp_server_oauth_token:
    path: /_mcp/oauth/token
    controller: Sylius\AdminMcpServerPlugin\Controller\OAuth\TokenController
    methods: [POST]

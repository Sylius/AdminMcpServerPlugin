imports:
    - { resource: "@SyliusAdminMcpServerPlugin/config/config.yaml" }
    - { resource: "services.php" }
    - { resource: "services_test.php" }

parameters:
    sylius_admin_mcp_server_api_resources_path: '%kernel.project_dir%/../../../config/api_platform/'

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\Sylius\AdminMcpServerPlugin
